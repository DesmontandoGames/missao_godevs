<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DValidação Simples de Formulário</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="chic-container contact-section">
    <div class="form-wrapper">
      <h2 class="form-title">Fale Conosco</h2>
      <p class="form-subtitle">Assine nossa newsletter ou entre em contato.</p>

      <div id="successMessage" class="success-msg hidden">
        Mensagem enviada com sucesso!
      </div>

      <form id="contactForm" novalidate>
        
        <div class="input-group">
          <label for="name">Nome</label>
          <input type="text" id="name" name="name" placeholder="Seu nome completo">
          <span class="error-msg" id="nameError">* O nome é obrigatório.</span>
        </div>

        <div class="input-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="seu@email.com">
          <span class="error-msg" id="emailError">* O e-mail é obrigatório.</span>
        </div>

        <button type="submit" class="mendo-btn form-btn">Enviar Mensagem</button>
      
      </form>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
